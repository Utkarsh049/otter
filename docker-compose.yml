services:
  redis:
    image: redis:alpine
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner
      network: host
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - LOG_FORMAT=json
      - MAX_CONCURRENT=8
      - HOST=0.0.0.0
      - PORT=8080
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped
