services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  test-runner:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: tester
      network: host
    privileged: true
    environment:
      - RUST_LOG=info
      - REDIS_URL=redis://127.0.0.1:6379
    depends_on:
      - redis
